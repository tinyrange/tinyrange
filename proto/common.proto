syntax = "proto3";

package proto;

// ----------------------
// BuildDefinition reference
// ----------------------
// In Go, BuildDefinition is an interface. Here we represent it as an indirect
// typed hash reference (string). Replace with a stronger type if needed.
message BuildDefinitionRef {
  string hash = 1; // Indirect reference to a BuildDefinition
}

// Package query used in plans.
message PackageQuery {
    bool match_direct = 1;
    string name = 2;
    bool match_partial_name = 3;
    string version = 4;
    repeated string tags = 5;
}

// Generic recursive value used in star builder arguments
message SerializableValue {
  oneof kind {
    string string_value = 1;
    bool bool_value = 2;
    SerializableList list_value = 3;
    BuildDefinitionRef definition_ref = 4;
    ChildSource child_source = 5;
  }
}

message SerializableList {
  repeated SerializableValue items = 1;
}

// Reference to a specific file within a source archive/tree.
message ChildSource {
  // Prefer to encode as a BuildDefinitionRef when available.
  BuildDefinitionRef source_def = 1;
  // Fallback to a nested SerializableValue if the source isn’t a definition.
  SerializableValue source_val = 2;
  string name = 3;
}

message File {
}
