syntax = "proto3";

package proto;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

message Hash {
  string value = 1;
}

message Definition {
  // A canonical type name, e.g. "tinyrange/v1/fetch_http".
  // This is the dispatch key for the registry.
  string type_name = 1;

  // The raw payload, encoded as an Any so it can carry arbitrary
  // protobuf messages defined by third parties.
  google.protobuf.Any payload = 2;
}

message DefinitionReference {
  // The hash of the referenced definition.
  string hash = 1;
}

message BuildClosure {
  // The root definition of the build.
  Definition root = 1;

  // All direct dependencies of the root definition.
  repeated Definition dependencies = 2;
}

message BuildReceipt {
  // The hash of the build itself.
  Hash hash = 1;

  // Direct dependencies of the build, identified by their hashes.
  repeated Hash dependencies = 2;

  // Start time of the build.
  google.protobuf.Timestamp start_time = 3;

  // End time of the build.
  google.protobuf.Timestamp end_time = 4;

  // Files produced by the build, secured with their hashes.
  map<string, Hash> outputs = 5;
}

message BuildRequest {
  // The build closure to build.
  BuildClosure closure = 1;
}

message BuildStatus {
  oneof status {
    // The build has completed successfully.
    BuildReceipt success = 1;
  }
}