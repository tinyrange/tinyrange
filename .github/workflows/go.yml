# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0

      - name: Build
        run: |
          go run ./tools/build.go

      - name: Run Basic Test
        run: |
          go run ./tools/build.go -test tests/basic

      - name: Run Shared Filesystem Test
        run: |
          go run ./tools/build.go -test tests/sharedFilesystem
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0

      - name: Build
        run: |
          go run ./tools/build.go

      - name: Run Basic Test
        run: |
          go run ./tools/build.go -test tests/basic

      - name: Run Shared Filesystem Test
        run: |
          go run ./tools/build.go -test tests/sharedFilesystem
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0

      - name: Build
        run: |
          go run ./tools/build.go -cgo

      - name: Run Basic Test
        run: |
          go run ./tools/build.go -test tests/basic

      - name: Run Shared Filesystem Test
        run: |
          go run ./tools/build.go -test tests/sharedFilesystem
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0

      - name: Build
        shell: pwsh
        run: |
          go run ./tools/build.go

      - name: Run Basic Test
        shell: pwsh
        run: |
          go run ./tools/build.go -test tests/basic

      - name: Run Shared Filesystem Test
        shell: pwsh
        run: |
          go run ./tools/build.go -test tests/sharedFilesystem
