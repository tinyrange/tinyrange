name: Lint (golangci-lint)

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: |
          go run ./tools/build.go

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
