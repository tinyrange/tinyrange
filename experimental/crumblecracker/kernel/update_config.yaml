#!/usr/bin/env tinyrange

version: 1
architecture: x86_64
builder: alpine@3.21
environment:
  - KERNEL_VERSION=5.15.178
commands:
  - mv /root/linux.config /root/linux-$KERNEL_VERSION/.config
  - cd /root/linux-$KERNEL_VERSION; make olddefconfig
  - mv /root/linux-$KERNEL_VERSION/.config /root/linux-$KERNEL_VERSION.proposed.config
files:
  - linux.config
archives:
  - https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-$KERNEL_VERSION.tar.xz
output: /root/linux-$KERNEL_VERSION.proposed.config
packages:
  - build-base
  - flex
  - bison
  - gmp-dev
  - mpc1-dev
  - openssl-dev
  - linux-headers
